# Always-on Ad Week. Start/update with:  docker compose up -d --build
services:
  adweek:
    build: .
    image: adweek:latest
    container_name: adweek
    restart: unless-stopped
    ports:
      # Reachable from your LAN and your tailnet. To allow ONLY Tailscale, replace with your
      # server's Tailscale IP, e.g. "100.101.102.103:3000:3000".
      - "3000:3000"
    env_file:
      - path: .env        # KROGER_CLIENT_ID / KROGER_CLIENT_SECRET (and optional ANTHROPIC_API_KEY)
        required: false
    volumes:
      - adweek-data:/app/data

volumes:
  adweek-data:
